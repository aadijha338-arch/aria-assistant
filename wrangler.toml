name = "aria-backend"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "aria-files"

[[vectorize]]
binding = "ARIA_MEMORY"
index_name = "aria-memory"

# Direct worker-to-worker binding to the self-evolving skill system.
# Avoids CF error 1042 (worker-to-worker over public workers.dev URLs).
[[services]]
binding = "SKILL_SYSTEM"
service = "aria-skill-system"

[observability]
enabled = true

[observability.logs]
enabled = true
